[project]
name = "srcipts"
version = "0.1.0"
description = "Self-contained Python automation scripts with modular dependency management"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pillow>=10.3.0",
    "exif>=1.6.1",
]

[project.optional-dependencies]
# Image compression using PIL with HEIC support
pixcomp = [
    "pillow-heif>=0.18.0",
    "tabulate>=0.9.0",
]

# CUDA-accelerated image compression
cupixcomp = [
    "numpy>=1.21.0",
    "pillow>=8.0.0",
    "cupy-cuda11x>=9.0.0",
]

# Video to GIF conversion
vid2gif = [
    "imageio>=2.34.1",
    "imageio-ffmpeg>=0.5.1",
    "pillow>=10.3.0",
    "numpy>=1.26.4",
]

# PDF document processing
pdf2xls = [
    "tabula-py>=2.5.0",
    "pandas>=2.0.0",
    "tabulate>=0.9.0",
    "openpyxl>=3.0.0",
]

# YouTube video downloader
downloader = ["pytube>=15.0.0"]

# Development and testing
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "exif",
]

# All optional dependencies
all = [
    "pillow>=10.3.0",
    "numpy>=1.21.0",
    "cupy-cuda11x>=9.0.0",
    "imageio>=2.34.1",
    "imageio-ffmpeg>=0.5.1",
    "tabula-py>=2.5.0",
    "pandas>=2.0.0",
    "tabulate>=0.9.0",
    "openpyxl>=3.0.0",
    "pytube>=15.0.0",
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "exif",
]

[project.scripts]
srcipts = "srcipts.cli:main"
